  <path d="M256 160 C270 200 310 260 310 295 C310 325 286 349 256 349 C226 349 202 325 202 295 C202 260 242 200 256 160 Z" 
        fill="url(#lotusGrad)"/>
  <circle cx="256" cy="270" r="18" fill="#FFFFFF"/>
